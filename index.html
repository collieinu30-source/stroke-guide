<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="دليل الجلطة">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#070d12">
<title>دليل الجلطة الدماغية</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* VOICE: هادئ وطبي، لأسرة تريد أن تفهم ما حدث
   IDEA: محطة تشريح رقمية في قسم الأعصاب: جسم حقيقي تطير حوله بالأسهم
   PICTURE: النموذج يملأ الشاشة؛ المخيخ الأيمن والشريان المسدود ينبضان بالأحمر، الدم يجري في الشرايين
   COLOUR and TYPE: ليل أزرق-أسود، عضل أحمر، عظم عاجي، أعصاب صفراء، أحمر للإصابة فقط؛ IBM Plex Sans Arabic
   LAYOUT: شاشة كاملة، شريط تبويبات سفلي، لوحات تنزلق عند الطلب، أسهم تحكم فوق الشريط */
:root{color-scheme:dark;--bg:#070d12;--glass:rgba(12,22,30,.9);--line:rgba(140,180,200,.22);--ink:#e8f1f5;--mute:#9db3bf;--red:#ff4d55;--gold:#ffc94d;--tab:64px;--sb:env(safe-area-inset-bottom);--st:env(safe-area-inset-top)}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font:16px/1.65 "IBM Plex Sans Arabic",Tahoma,sans-serif;overscroll-behavior:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid #5fb4ff;outline-offset:2px}
.num{direction:ltr;unicode-bidi:isolate;white-space:nowrap;font-weight:700}
/* top */
.top{position:fixed;top:calc(8px + var(--st));inset-inline:10px;display:flex;justify-content:space-between;align-items:flex-start;gap:8px;pointer-events:none;z-index:5}
.top>*{pointer-events:auto}
.title{background:var(--glass);border:1px solid var(--line);border-radius:14px;padding:6px 12px;font-size:14px;line-height:1.35;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.title b{display:block;font-size:15px}
.pills{display:flex;gap:6px;align-items:center;flex:none}
.title{flex:1 1 0}
.pill{border:1px solid var(--line);background:var(--glass);border-radius:999px;min-height:40px;padding:4px 12px;font-size:14px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.pill.sos{background:#b3141c;border-color:#e0434b;font-weight:700;padding:4px 16px;white-space:nowrap;min-width:76px;text-align:center}
/* info card */
#info{position:fixed;top:calc(64px + var(--st));inset-inline:10px;max-width:440px;margin-inline-start:auto;background:var(--glass);border:1px solid var(--line);border-radius:16px;padding:12px 14px 12px 44px;font-size:15px;line-height:1.6;display:none;z-index:6;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
#info h3{margin:0 0 2px;font-size:17px;color:#fff}
#info .en{font-size:12px;color:var(--mute);direction:ltr;text-align:right}
#info .x{position:absolute;top:6px;left:6px;width:34px;height:34px;border-radius:50%;border:0;background:rgba(255,255,255,.08)}
/* controls (Roblox-like) */
.ctl{position:fixed;bottom:calc(var(--tab) + var(--sb) + 14px);z-index:4;direction:ltr;display:grid;gap:6px;transition:opacity .2s}
.ctl button{width:50px;height:50px;border-radius:14px;border:1px solid var(--line);background:rgba(12,22,30,.72);font-size:22px;line-height:1;display:grid;place-items:center;user-select:none;-webkit-user-select:none;touch-action:none;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.ctl button:active,.ctl button.on{background:rgba(95,180,255,.35)}
#pad{left:12px;grid-template-columns:repeat(3,50px);grid-template-areas:". u ." "l c r" ". d ."}
#pad .c{grid-area:c;font-size:13px}
#vz{right:12px;grid-template-columns:repeat(2,50px)}
#vz button{font-size:15px;font-weight:700}
body.sheet-open .ctl{opacity:0;pointer-events:none}
/* tabs */
nav.tabs{position:fixed;bottom:0;inset-inline:0;height:calc(var(--tab) + var(--sb));padding-bottom:var(--sb);display:grid;grid-template-columns:repeat(5,minmax(0,1fr));background:rgba(7,13,18,.94);border-top:1px solid var(--line);z-index:8;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
nav.tabs button{border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12.5px;color:var(--mute);min-height:44px}
nav.tabs svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button[aria-selected=true]{color:#fff}
nav.tabs button[aria-selected=true] svg{stroke:var(--red)}
/* sheet */
#sheet{position:fixed;inset-inline:0;bottom:calc(var(--tab) + var(--sb));max-height:62dvh;height:62dvh;background:var(--glass);border-top:1px solid var(--line);border-radius:22px 22px 0 0;z-index:7;transform:translateY(110%);transition:transform .32s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
body.sheet-open #sheet{transform:none}
.sh-head{display:flex;align-items:center;justify-content:space-between;padding:8px 14px 4px;gap:8px}
.sh-head h2{margin:0;font-size:20px}
.grab{position:absolute;top:6px;left:50%;width:40px;height:5px;border-radius:3px;background:rgba(255,255,255,.25);transform:translateX(-50%)}
.close{border:1px solid var(--line);background:rgba(255,255,255,.06);border-radius:999px;min-height:40px;padding:4px 14px;font-size:14px}
.sh-body{overflow-y:auto;padding:4px 16px 24px;-webkit-overflow-scrolling:touch}
.sh-body p{margin:0 0 10px}
.sh-body h3{font-size:16px;margin:16px 0 6px;color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 10px}
.chip{border:1px solid var(--line);background:rgba(255,255,255,.05);border-radius:999px;min-height:42px;padding:6px 14px;font-size:14.5px;display:inline-flex;align-items:center;gap:8px}
.chip[aria-pressed=true]{background:#e8f1f5;color:#071017;border-color:#e8f1f5}
.chip i{width:10px;height:10px;border-radius:50%;display:inline-block}
.card{background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:8px 0}
.card.hot{border-color:rgba(255,77,85,.6);background:rgba(255,77,85,.08)}
.card b{color:#fff}
ul{margin:4px 0 8px;padding-inline-start:20px}li{margin:3px 0}
.leg{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));gap:6px;font-size:14px}
.leg span{display:flex;gap:8px;align-items:center}.leg i{width:12px;height:12px;border-radius:3px;flex:none}
input[type=range]{width:100%;height:44px;accent-color:var(--red)}
.meter{height:12px;background:rgba(255,255,255,.1);border-radius:6px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--red);transition:width .3s}
.scale{display:flex;border-radius:8px;overflow:hidden;font-size:11.5px;text-align:center;color:#fff;margin:8px 0}
.scale span{flex:1;padding:5px 2px;line-height:1.3}
.cat{display:inline-block;padding:3px 12px;border-radius:999px;color:#fff;font-weight:600}
.fast{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.fast div{background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:12px;padding:8px;text-align:center;font-size:13.5px}
.fast b{display:block;font-size:22px;color:var(--red)}
.small{font-size:13px;color:var(--mute)}
/* loader */
#load{position:fixed;inset:0;z-index:20;background:var(--bg);display:grid;place-items:center;text-align:center;padding:24px;transition:opacity .5s}
#load .bar{width:min(260px,70vw);height:6px;border-radius:3px;background:rgba(255,255,255,.12);overflow:hidden;margin:14px auto 8px}
#load .bar i{display:block;height:100%;width:0;background:var(--red);transition:width .2s}
#load h1{font-size:24px;margin:0}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
@media(min-width:900px){#sheet{inset-inline-start:auto;width:420px;inset-inline-end:16px;border-radius:22px;bottom:calc(var(--tab) + 16px);border:1px solid var(--line)}}
</style>
</head>
<body>
<canvas id="c" aria-label="نموذج تشريحي ثلاثي الأبعاد"></canvas>

<div id="load"><div><h1>دليل الجلطة الدماغية</h1><div class="bar"><i id="lbar"></i></div><div class="small" id="ltxt">جارٍ تحميل النموذج التشريحي…</div></div></div>

<div class="top">
  <div class="title"><b>جلطة المخيخ الأيمن</b><span class="small">اسحب للتدوير · الأسهم للتنقل · اضغط على أي عضو</span></div>
  <div class="pills">
    <button class="pill" id="bpPill" aria-label="ضغط الدم"><span class="num" id="bpTop">200/110</span></button>
    <button class="pill sos" id="sos">طوارئ</button>
  </div>
</div>

<div id="info" role="dialog" aria-live="polite"><button class="x" id="infoX" aria-label="إغلاق">✕</button><div id="infoBody"></div></div>

<div class="ctl" id="pad" aria-label="أسهم التنقل">
  <button data-mv="f" style="grid-area:u" aria-label="للأمام">▲</button>
  <button data-mv="l" style="grid-area:l" aria-label="يسار">◀</button>
  <button class="c" id="reset" aria-label="إعادة الضبط">⟲</button>
  <button data-mv="r" style="grid-area:r" aria-label="يمين">▶</button>
  <button data-mv="b" style="grid-area:d" aria-label="للخلف">▼</button>
</div>
<div class="ctl" id="vz" aria-label="الارتفاع والتكبير">
  <button data-mv="u" aria-label="للأعلى">⤒</button><button data-mv="i" aria-label="تكبير">＋</button>
  <button data-mv="d" aria-label="للأسفل">⤓</button><button data-mv="o" aria-label="تصغير">－</button>
</div>

<section id="sheet" aria-live="polite">
  <div class="grab"></div>
  <div class="sh-head"><h2 id="shTitle"></h2><button class="close" id="shClose">إخفاء ▾</button></div>
  <div class="sh-body" id="shBody"></div>
</section>

<nav class="tabs" role="tablist">
  <button role="tab" data-tab="body" aria-selected="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="4" r="2.2"/><path d="M12 7v7M7 9.5l5-1.5 5 1.5M9 22l3-8 3 8"/></svg>الجسم</button>
  <button role="tab" data-tab="brain" aria-selected="false"><svg viewBox="0 0 24 24"><path d="M9 4a3 3 0 0 0-3 3 3 3 0 0 0-2 5 3 3 0 0 0 2 5 3 3 0 0 0 6 1V5a2 2 0 0 0-3-1zM15 4a3 3 0 0 1 3 3 3 3 0 0 1 2 5 3 3 0 0 1-2 5 3 3 0 0 1-6 1"/></svg>الدماغ</button>
  <button role="tab" data-tab="stroke" aria-selected="false"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>الجلطة</button>
  <button role="tab" data-tab="heart" aria-selected="false"><svg viewBox="0 0 24 24"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/><path d="M5 12h4l1.5-3 2 6 1.5-3H19"/></svg>القلب</button>
  <button role="tab" data-tab="bp" aria-selected="false"><svg viewBox="0 0 24 24"><path d="M4 16a8 8 0 1 1 16 0"/><path d="M12 16l4-5"/><circle cx="12" cy="16" r="1.4"/></svg>الضغط</button>
</nav>

<template id="t-body">
  <p>نموذج تشريحي حقيقي: عظام وعضلات بأسمائها، شرايين كبيرة وصغيرة يجري فيها الدم، وأعصاب. اضغط على أي جزء لتعرف اسمه ووظيفته.</p>
  <h3>الطبقات</h3>
  <div class="chips" data-layers="skin,muscles,bones,arteries,nerves,brain,heart"></div>
  <h3>انتقل إلى</h3>
  <div class="chips"><button class="chip" data-go="body">الجسم كامل</button><button class="chip" data-go="handR">اليد اليمنى</button><button class="chip" data-go="faceR">الوجه</button><button class="chip" data-go="neck">شرايين الرقبة</button></div>
  <div class="leg"><span><i style="background:#c0392b"></i>عضلات بأليافها</span><span><i style="background:#e9dfc8"></i>عظام</span><span><i style="background:#ff3b3b"></i>شرايين (الدم يجري)</span><span><i style="background:#ffd23f"></i>أعصاب</span><span><i style="background:#ff8a00"></i>مناطق متأثرة</span></div>
  <p class="small" style="margin-top:14px">للتثقيف فقط ولا يغني عن الطبيب. النماذج التشريحية من مشروع Z-Anatomy (رخصة CC BY-SA 4.0)، مسارات الألياف من أطلس HCP1065 (Yeh 2022)، وتقسيم الفصوص من أطلس AAL. الشرايين الدقيقة مرسومة تقريبياً على سطح الدماغ الحقيقي.</p>
</template>

<template id="t-brain">
  <p>دماغ حقيقي بتلافيفه وأخاديده، المخيخ بفصيصاته، جذع الدماغ، والحبل الشوكي. الألياف الملونة هي مسارات عصبية حقيقية من أطلس تصوير الدماغ.</p>
  <h3>الطبقات</h3>
  <div class="chips" data-layers="cortex,lobes,cerebellum,brainstem,brainart,tracts,cord"></div>
  <h3>شريحة داخل الدماغ</h3>
  <p class="small">حرّك المؤشر لقطع نصف الدماغ ورؤية ما بداخله.</p>
  <input type="range" id="clip" min="-0.075" max="0.075" step="0.001" value="0.075" aria-label="قص الدماغ">
  <h3>انتقل إلى</h3>
  <div class="chips"><button class="chip" data-go="brain">الدماغ</button><button class="chip" data-go="brainBack">من الخلف</button><button class="chip" data-go="brainBase">قاعدة الدماغ والشرايين</button><button class="chip" data-go="cbl">المخيخ</button></div>
  <h3>ألوان الفصوص (عند تفعيل «تلوين الفصوص»)</h3>
  <div class="leg"><span><i style="background:#de786e"></i>الجبهي: التفكير والسلوك</span><span><i style="background:#f05a5a"></i>شريط الحركة</span><span><i style="background:#5ac8dc"></i>شريط الإحساس</span><span><i style="background:#6eaae1"></i>الجداري: الإحساس والمكان</span><span><i style="background:#78c88c"></i>الصدغي: السمع والذاكرة واللغة</span><span><i style="background:#e6be5a"></i>القذالي: الرؤية</span><span><i style="background:#be8cdc"></i>الجزيرة والحوفي</span></div>
  <h3>ألوان الألياف العصبية</h3>
  <div class="leg"><span><i style="background:#b678ff"></i>مسار الحركة (القشري الشوكي)</span><span><i style="background:#ff7a3d"></i>سويقات المخيخ</span><span><i style="background:#ffb03d"></i>مسار المخيخ ← المهاد</span><span><i style="background:#3dd6ff"></i>مسار الإحساس</span><span><i style="background:#ffe14d"></i>الأعصاب القحفية</span><span><i style="background:#8fe388"></i>الجسم الثفني</span><span><i style="background:#9aa7ff"></i>مسارات اللغة والربط</span></div>
</template>

<template id="t-stroke">
  <div class="chips"><button class="chip" data-go="lesion">المخيخ المصاب</button><button class="chip" data-go="pica">الشريان المسدود</button><button class="chip" data-go="stem">جذع الدماغ</button><button class="chip" data-go="handR">اليد</button><button class="chip" data-go="faceR">الوجه</button></div>
  <div class="card hot"><b>ما حدث (مثال توضيحي)</b><p style="margin:4px 0 0">خثرة سدّت الشريان المخيخي الخلفي السفلي الأيمن (PICA)، فانقطع الدم عن الجزء السفلي من المخيخ الأيمن وعن جزء صغير ملاصق من جذع الدماغ. في النموذج: الشريان الداكن بلا دم، والمنطقة الحمراء النابضة هي المتأثرة.</p></div>
  <h3>لماذا ظهرت الأعراض؟</h3>
  <div class="card"><b>القبضة ثقيلة رغم أن اليد ترتفع</b><p style="margin:4px 0 0">عضلات الكتف والذراع الكبيرة تأخذ أوامرها من مسار الحركة الرئيسي، وهو سليم، لذلك يرفع يده ويحركها. أما إغلاق القبضة والتحكم بكل إصبع فيحتاج تنسيق المخيخ لتوقيت عشرات العضلات الصغيرة في الساعد واليد (البرتقالية في النموذج). المخيخ يتحكم في <b>نفس الجهة</b>، فإصابة الأيمن تظهر في اليد اليمنى.</p></div>
  <div class="card"><b>تنميل وضعف نصف الوجه الأيمن</b><p style="margin:4px 0 0">العصب الخامس (البرتقالي في الوجه) ينقل إحساس الوجه، ونواته تمتد داخل جذع الدماغ بجانب المخيخ. تأثر هذا الجزء من جذع الدماغ يفسّر التنميل في نفس الجهة.</p></div>
  <div class="card"><b>ثقل الكلام</b><p style="margin:4px 0 0">عضلات اللسان والشفاه سليمة، لكن المخيخ لم يعد يضبط توقيتها مع التنفس، فيخرج الكلام بطيئاً أو متقطعاً.</p></div>
  <p class="small">شرح تعليمي عام. الطبيب وصور الرنين هم من يحددون مكان الجلطة بدقة.</p>
  <h3>علامات خطر — اتصل بالإسعاف فوراً</h3>
  <ul><li>صداع شديد مفاجئ أو قيء متكرر</li><li>نعاس غير طبيعي أو صعوبة الاستيقاظ</li><li>زيادة ثقل الكلام أو ضعف الجسم أو عدم القدرة على الوقوف</li><li>ازدواج الرؤية أو صعوبة البلع أو التنفس</li></ul>
  <p class="small">المخيخ في مساحة ضيقة، وقد يتورم في الأيام الأولى ويضغط على جذع الدماغ.</p>
  <h3>علامات الجلطة B.E. F.A.S.T</h3>
  <div class="fast"><div><b>B</b>توازن</div><div><b>E</b>نظر</div><div><b>F</b>الوجه</div><div><b>A</b>الذراع</div><div><b>S</b>الكلام</div><div><b>T</b>اتصل فوراً</div></div>
  <h3>التعافي</h3>
  <p>أسرع تحسن غالباً في أول 3–6 أشهر ويستمر بعدها. المخيخ يتعلم بالتكرار: عصر كرة إسفنجية، فتح وإغلاق الأصابع ببطء، التقاط أشياء صغيرة، تمارين النطق بصوت عالٍ — بإشراف أخصائي علاج طبيعي ونطق.</p>
</template>

<template id="t-heart">
  <p>القلب الحقيقي ينبض في النموذج، والشرايين التاجية على سطحه. حرّك الضغط وشاهد القلب يدق أسرع ويتضخم والدم يندفع أقوى في الشرايين.</p>
  <div class="chips"><button class="chip" data-go="heart">القلب</button><button class="chip" data-go="aorta">الشريان الأبهر</button></div>
  <div data-bp></div>
  <h3>ماذا يحدث للقلب مع الضغط المرتفع؟</h3>
  <div class="card"><b>يضخ ضد مقاومة أعلى</b><p style="margin:4px 0 0">البطين الأيسر يدفع الدم إلى الأبهر. كلما ارتفع الضغط احتاج قوة أكبر في كل نبضة واستهلك أكسجيناً أكثر.</p></div>
  <div class="card"><b>يتضخم جداره ويتصلب</b><p style="margin:4px 0 0">مع الوقت يزداد سمك جدار البطين الأيسر، فيمتلئ بصعوبة، وقد يؤدي ذلك إلى قصور القلب.</p></div>

    s.vertexShader=s.vertexShader.replace('#include <common>','#include <common>\nvarying vec3 vW;').replace('#include <worldpos_vertex>','#include <worldpos_vertex>\nvW=(modelMatrix*vec4(transformed,1.0)).xyz;');

    title=(d.ar||(d.kind==='bone'?'عظمة':'عضلة'))+sideTxt;en=d.en.replace(/[._]\d+$/,'').replace(/_/g,' ');
    txt=d.kind==='bone'?'جزء من الهيكل العظمي.':(d.grp&&GROUPTXT[d.grp])||'عضلة هيكلية. الخطوط الدقيقة على سطحها تمثّل اتجاه الألياف العضلية.';
    if(d.kind==='muscle'&&d.grp&&d.side==='L'&&(d.grp==='grip'||d.grp==='hand'))txt='من عضلات القبضة والأصابع في اليد اليسرى — تعمل بشكل طبيعي لأن المخيخ الأيسر سليم.';
    highlight(o);
  } else {title=d.ar;txt=d.txt}
  showInfo(title,txt,en);
}
function highlight(o){if(selOld){selOld.material=selOld.userData._m;selOld=null}
  if(o.userData.kind==='muscle'||o.userData.kind==='bone'){o.userData._m=o.material;const m=o.material.clone();m.onBeforeCompile=o.material.onBeforeCompile;m.customProgramCacheKey=o.material.customProgramCacheKey;m.userData=o.material.userData;m.emissive=new THREE.Color(0x3a5cff);m.emissiveIntensity=.6;o.material=m;selOld=o}}
function showInfo(t,x,en){$('#infoBody').innerHTML='';const h=document.createElement('h3');h.textContent=t;const p=document.createElement('div');p.innerHTML=x;$('#infoBody').append(h);if(en){const e=document.createElement('div');e.className='en';e.textContent=en;$('#infoBody').append(e)}$('#infoBody').append(p);$('#info').style.display='block'}
function hideInfo(){$('#info').style.display='none';if(selOld){selOld.material=selOld.userData._m;selOld=null}}
$('#infoX').onclick=hideInfo;

// ---------- layers & tabs ----------
const LAYERNAMES={skin:'الجلد',muscles:'العضلات',bones:'العظام',arteries:'الشرايين',nerves:'الأعصاب',brain:'الدماغ',heart:'القلب',cortex:'القشرة',lobes:'تلوين الفصوص',cerebellum:'المخيخ',brainstem:'جذع الدماغ',brainart:'شرايين الدماغ',tracts:'الألياف العصبية',cord:'الحبل الشوكي'};
const state={lobes:false};
const isOn=k=>k==='lobes'?state.lobes:k==='brain'?L.cortex.visible:L[k].visible;
function setLayer(k,v){if(k==='lobes'){state.lobes=v;cortexMesh.material=v?lobeMat:cortexMat;if(v&&!cortexMesh.geometry.attributes.color)cortexMesh.geometry.setAttribute('color',cortexMesh.userData.colors);return}
  if(k==='brain'){['cortex','cerebellum','brainstem','brainart','lesion'].forEach(n=>L[n].visible=v);return}
  L[k].visible=v;if(k==='cerebellum')L.lesion.visible=v;}
const PRESET={body:{skin:true,muscles:true,bones:true,arteries:true,nerves:true,heart:true,cortex:false,cerebellum:false,brainstem:false,brainart:false,tracts:false,cord:false,lesion:false},
brain:{skin:false,muscles:false,bones:false,arteries:false,nerves:false,heart:false,cortex:true,cerebellum:true,brainstem:true,brainart:true,tracts:false,cord:true,lesion:true},
stroke:{skin:false,muscles:true,bones:false,arteries:true,nerves:true,heart:false,cortex:true,cerebellum:true,brainstem:true,brainart:true,tracts:false,cord:false,lesion:true},
heart:{skin:false,muscles:false,bones:false,arteries:true,nerves:false,heart:true,cortex:false,cerebellum:false,brainstem:false,brainart:false,tracts:false,cord:false,lesion:false}};
PRESET.bp=PRESET.heart;
const TITLES={body:'الجسم',brain:'الدماغ والمخيخ',stroke:'جلطة المخيخ الأيمن',heart:'القلب',bp:'ضغط الدم',sos:'متى تتصلون بالإسعاف؟'};
const FIRST={body:'body',brain:'brain',stroke:'lesion',heart:'heart',bp:'heart'};
let curTab='body';
function openTab(t,{keepCam=false,open=true}={}){
  const same=t===curTab&&document.body.classList.contains('sheet-open');
  curTab=t;$$('nav.tabs button').forEach(b=>b.setAttribute('aria-selected',b.dataset.tab===t));
  if(PRESET[t]){for(const [k,v] of Object.entries(PRESET[t]))L[k].visible=v;if(t!=='brain')setLayer('lobes',false);clipPlane.constant=0.075;}
  hot=(t==='stroke');for(const m of L.muscles.children)m.visible=!hot||!!m.userData.hot;
  if(!keepCam&&FIRST[t])go(FIRST[t]);
  if(same){document.body.classList.remove('sheet-open');return}
  $('#shTitle').textContent=TITLES[t];const body=$('#shBody');body.innerHTML='';body.append($('#t-'+t).content.cloneNode(true));body.scrollTop=0;
  body.querySelectorAll('[data-layers]').forEach(w=>{for(const k of w.dataset.layers.split(',')){const b=document.createElement('button');b.className='chip';b.textContent=LAYERNAMES[k];b.setAttribute('aria-pressed',isOn(k));
    b.onclick=()=>{setLayer(k,!isOn(k));b.setAttribute('aria-pressed',isOn(k))};w.append(b)}});
  body.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{go(b.dataset.go);if(innerHeight<760)document.body.classList.remove('sheet-open')});
  body.querySelectorAll('[data-bp]').forEach(w=>{w.append($('#t-bpctl').content.cloneNode(true));w.querySelectorAll('input').forEach(i=>{i.value=bp[i.dataset.k];i.oninput=()=>{bp[i.dataset.k]=+i.value;updBP()}})});
  const cl=body.querySelector('#clip');if(cl){cl.value=clipPlane.constant;cl.oninput=()=>{clipPlane.constant=+cl.value}}
  if(open)document.body.classList.add('sheet-open');updBP();
}
$$('nav.tabs button').forEach(b=>b.onclick=()=>openTab(b.dataset.tab));
$('#shClose').onclick=()=>document.body.classList.remove('sheet-open');
$('#sos').onclick=()=>{curTab='sos';$('#shTitle').textContent=TITLES.sos;$('#shBody').innerHTML='';$('#shBody').append($('#t-sos').content.cloneNode(true));document.body.classList.add('sheet-open')};
$('#bpPill').onclick=()=>openTab('bp');
// swipe down on sheet head closes
{let y0=null;$('.sh-head').addEventListener('pointerdown',e=>y0=e.clientY);addEventListener('pointerup',e=>{if(y0!==null&&e.clientY-y0>40)document.body.classList.remove('sheet-open');y0=null})}

// ---------- blood pressure ----------
const bp={s:200,d:110};let hot=false;
const CATS=[[180,120,'أزمة ارتفاع ضغط','#c62828'],[140,90,'المرحلة 2','#e0701e'],[130,80,'المرحلة 1','#e0a21e'],[120,999,'مرتفع','#8fae2b'],[0,0,'طبيعي','#2e9e6b']];
function bpK(){return Math.min(1,Math.max(0,(bp.s-110)/140))}
function updBP(){
  const k=bpK();U.bp.value=k;$('#bpTop').textContent=bp.s+'/'+bp.d;
  const c=CATS.find(([s,d])=>bp.s>=s||bp.d>=d);const hr=Math.round(68+k*32);
  $$('[data-v]').forEach(el=>{const v=el.dataset.v;
    if(v==='s')el.textContent=bp.s;if(v==='d')el.textContent=bp.d;if(v==='hr')el.textContent=hr+' نبضة/د';
    if(v==='cat'){el.textContent=c[2];el.style.background=c[3]}
    if(v==='load')el.style.width=Math.min(100,Math.max(4,(bp.s-90)/160*100))+'%';
    if(v==='txt')el.textContent=(bp.s>=120?'+'+Math.round((bp.s/120-1)*100)+'% جهد إضافي. ':'')+(bp.s>=180?'القلب يدفع الدم ضد مقاومة عالية جداً، والشرايين الصغيرة في الدماغ والكلى والعين تحت ضغط قد يمزقها — مستوى طوارئ.':bp.s>=140?'جهد مستمر على القلب؛ مع الوقت يتضخم البطين الأيسر ويرتفع خطر جلطة جديدة.':bp.s>=120?'أعلى من المثالي بقليل.':'ضغط مثالي، القلب يعمل براحة.')});
  heartMat.emissive.setRGB(.13+.35*k,0,0);
}

// ---------- resize & loop ----------
function resize(){renderer.setSize(innerWidth,innerHeight,false);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix()}
addEventListener('resize',resize);resize();
const still=matchMedia('(prefers-reduced-motion: reduce)').matches;
const clock=new THREE.Clock();let phase=0;const off3=new THREE.Vector3();
const hotMeshes=L.muscles.children.filter(m=>m.userData.hot);
function frame(){
  const dt=Math.min(clock.getDelta(),.05);U.time.value+=still?0:dt;stepMove(dt);
  const a=1-Math.pow(.0015,dt);cam.t.lerp(goal.t,a);cam.yaw+=(goal.yaw-cam.yaw)*a;cam.pitch+=(goal.pitch-cam.pitch)*a;cam.dist+=(goal.dist-cam.dist)*a;
  off3.set(Math.sin(cam.yaw)*Math.cos(cam.pitch),Math.sin(cam.pitch),Math.cos(cam.yaw)*Math.cos(cam.pitch)).multiplyScalar(cam.dist);
  camera.position.copy(cam.t).add(off3);camera.lookAt(cam.t);camera.near=Math.max(0.001,cam.dist*0.02);camera.updateProjectionMatrix();
  const k=bpK();phase+=dt*(68+k*32)/60*Math.PI*2;const beat=still?0:Math.pow(Math.max(0,Math.sin(phase)),6);
  if(heartMesh){const piv=heartMesh.userData.piv;const s=1+k*.08;piv.scale.set(s*(1+beat*.05),s*(1-beat*.035),s*(1+beat*.05));}
  const pulse=still?.6:(Math.sin(U.time.value*3.2)+1)/2;
  lesionMat.emissive.setRGB(.3+.5*pulse,0,0);lm.material.opacity=.3+.4*pulse;
  for(const m of hotMeshes)m.material.userData.hot.value=hot?1:0;
  renderer.render(scene,camera);requestAnimationFrame(frame);
}
openTab('body',{open:false});cam.t.copy(goal.t);cam.yaw=goal.yaw;cam.pitch=goal.pitch;cam.dist=goal.dist+1.2;
frame();
$('#load').style.opacity=0;setTimeout(()=>$('#load').remove(),600);
window.__ready=true;
}catch(e){fail(e)}
</script>
